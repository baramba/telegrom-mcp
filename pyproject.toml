[project]
name = "telegrom-mcp"
version = "0.1.0"
description = "Policy-guarded Telegram MCP server (Telethon)"
readme = "README.md"
authors = [
    { name = "Maxim Babikhin", email = "babikhin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "telethon>=1.45.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.scripts]
telegrom-mcp = "telegrom_mcp.server:main"
telegrom-mcp-login = "telegrom_mcp.login:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "telethon.*"
ignore_missing_imports = true
